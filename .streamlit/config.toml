[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[theme]
# Design System Colors (60/30/10 Rule)
# 60% Neutral Base
primaryColor = "#10B981"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
font = "sans serif"

[runner]
magicEnabled = true
installTracer = false
fixMatplotlib = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501