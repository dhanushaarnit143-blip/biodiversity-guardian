[project]
name = "biodiversity-guardian"
version = "0.1.0"
description = "AI-powered ecosystem monitoring platform for biodiversity conservation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "librosa>=0.10.1",
    "torchaudio>=2.1.0",
    "soundfile>=0.12.1",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "ultralytics>=8.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "xgboost>=2.0.0",
    "shap>=0.43.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.15.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
